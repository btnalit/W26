# WC26 Production Deployment Manifest
# Source repo → production path mapping
# Run: bash deploy/deploy.sh

profile:
  description: "Hermes profile scripts — scheduled cron payloads and report contract"
  source: "profile/"
  targets:
    - dest: "/wc26-profile/wc26_cron_payload.py"
      from: "profile/scripts/wc26_cron_payload.py"
    - dest: "/root/.hermes/scripts/wc26*.py"
      from: "profile/scripts/wc26*.py"
      note: "Hermes cron script registry resolves relative script names from this active-profile scripts directory"

skill_scripts:
  description: "Odds-analysis skill scripts — imported by cron payload via load_module()"
  source: "profile/skills/odds-analysis/scripts/"
  dest_dir: "/skills/odds-analysis/scripts/"
  canonical_only: true
  note: "deploy.sh copies from canonical (skills/), NOT from workspace shim"

shared_scripts:
  description: "Shared scripts — deployed from canonical path only"
  canonical_source: "profile/skills/odds-analysis/scripts/"
  targets:
    - dest: "/hermesdata/worldcup-2026-handicap/scripts/cross_book_scan.py"
      note: "deployed from canonical skill version; workspace/scripts/cross_book_scan.py is a shim that imports canonical"

init_files:
  description: "__init__.py files for package imports"
  files:
    - dest: "/scripts/__init__.py"
      content: "# Hermes shared scripts package\n"
    - dest: "/skills/odds-analysis/scripts/__init__.py"
      content: "# WC26 skill scripts package\n"

audit_trail:
  description: "Deploy audit"
  backup_dir: "/wc26-backup/<timestamp>/"
  log_file: "/wc26-backup/DEPLOYED_SHA"
  fields:
    - deployed_at_utc
    - commit_sha
    - repo_root

pre_push_hook:
  description: "CI gate — installed by: cp deploy/pre-push .git/hooks/pre-push && chmod +x"
  file: "deploy/pre-push"
  tests: "97 total (92 existing + 5 CLV math)"

cron_manifest:
  description: "Hermes scheduler source of truth and deploy-time assertion"
  source: "deploy/cron-manifest.json"
  checker: "deploy/check_cron_manifest.py"
  required_jobs:
    - wc26-fixture-collect
    - wc26-match-window-direct
    - wc26-postmatch-grade
    - wc26-postmatch-notify
    - wc26-blocked-recovery
